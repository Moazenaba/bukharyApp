name: Publish Android

# Builds the signed release APK and hands it to every installed copy of the app:
# the APK and app/android.json are committed to the web repo (public/app), and the web app's
# next deploy serves them. The app's updater (AppUpdater) installs it the next time it opens.
#
# Run it from GitHub > Actions > "Publish Android" > Run workflow, after raising versionCode and
# versionName in app/build.gradle.kts and merging to main. Secrets are listed in the README.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "ما الجديد (يظهر في ملف التحديث)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-android
  cancel-in-progress: false

jobs:
  publish:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only what is on main can reach people's phones.
    if: github.ref == 'refs/heads/main'
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      BUKHARY_PUSH_TOKEN: ${{ secrets.BUKHARY_PUSH_TOKEN }}
      ANDROID_SIGNER_SHA256: ${{ secrets.ANDROID_SIGNER_SHA256 }}
    steps:
      - name: Check the secrets are set
        run: |
          missing=""
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD ANDROID_SIGNER_SHA256 API_BASE_URL BUKHARY_PUSH_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (run \"Create signing key\" once for the key ones; the others: Settings > Secrets and variables > Actions)"
            exit 1
          fi
          case "$API_BASE_URL" in https://*/) ;; *) echo "::error::API_BASE_URL must start with https:// and end with /"; exit 1;; esac

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build the signed release
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew --no-daemon assembleRelease -PrequireReleaseSigning=true -PAPI_BASE_URL="$API_BASE_URL"
          ls -l app/build/outputs/apk/release/

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: bukhari-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Check out the web app
        uses: actions/checkout@v4
        with:
          repository: Moazenaba/bukhary
          ref: main
          token: ${{ secrets.BUKHARY_PUSH_TOKEN }}
          path: web

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Rejects an APK that is another app, signed with another key, or not newer than the
      # published one (Android would refuse such an update).
      - name: Prepare the update files
        working-directory: web
        env:
          NOTES: ${{ inputs.notes }}
          # The script only accepts an APK signed with this key.
          ANDROID_SIGNER_SHA256: ${{ secrets.ANDROID_SIGNER_SHA256 }}
        run: node scripts/publish-android.mjs "$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk" "$NOTES"

      - name: Publish to the web app
        working-directory: web
        run: |
          version=$(node -p "require('./public/app/android.json').versionName")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app
          git commit -m "Publish Android $version"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Published $version. Phones get it the next time the app opens, after the web app deploys." >> "$GITHUB_STEP_SUMMARY"
