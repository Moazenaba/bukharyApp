name: CI

# Every pushed branch is checked; pull requests too, so branch protection can require the checks.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release version script
        run: node --test scripts/next-version.test.mjs
      - run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest assembleDebug
      # Release must build with an https server URL; this placeholder only proves the release
      # configuration (minify, ProGuard rules) compiles. The APK is unsigned and not published.
      - run: ./gradlew --no-daemon assembleRelease -PAPI_BASE_URL=https://ci.invalid/
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # The V2 screenshots the render test draws, kept on the `ci-shots` branch (never main) so they can be read
  # with plain git. One commit, replaced each time; only for pushes to this repository's own branches.
  shots:
    name: Publish V2 screenshots
    needs: build
    if: always() && github.event_name == 'push' && github.repository == 'Moazenaba/bukharyApp'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: unit-test-reports
          path: reports
      - name: Push to ci-shots
        run: |
          [ -d reports/v2-shots ] || { echo "no screenshots"; exit 0; }
          mkdir out && cp reports/v2-shots/*.png out/ && cd out
          echo "${GITHUB_SHA} ${GITHUB_REF_NAME}" > SOURCE.txt
          git init -q -b ci-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "V2 screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-shots
